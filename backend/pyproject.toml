[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storepulse-backend"
version = "0.1.0"
description = "StorePulse AI - multi-tenant retail forecasting & store autopilot API and workers"
requires-python = ">=3.11"
dependencies = [
  # API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "sse-starlette>=2.1",
  # Database
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  # Queue
  "celery[redis]>=5.4",
  "redis>=5.0",
  # Data / ML
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "optuna>=3.6",
  "joblib>=1.4",
  "matplotlib>=3.8",
  # Storage & reports
  "boto3>=1.34",
  "reportlab>=4.2",
]

[project.optional-dependencies]
# PyTorch is optional: install the CUDA wheel matching your driver for GPU training,
# e.g. pip install torch --index-url https://download.pytorch.org/whl/cu124
torch = ["torch>=2.3"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
